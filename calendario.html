<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calendario - Ispezioni Ticino</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Ispezioni Ticino</h1>
<h2 id="company-name"></h2>
        <p>Calendario delle prenotazioni</p>

        <div class="calendar-box">

            <div class="calendar-header">
                <button id="prevMonth">‹</button>

                <h2 id="monthTitle"></h2>

                <button id="nextMonth">›</button>
            </div>

            <div class="weekdays">
                <div>Lun</div>
                <div>Mar</div>
                <div>Mer</div>
                <div>Gio</div>
                <div>Ven</div>
                <div>Sab</div>
                <div>Dom</div>
            </div>

            <div id="calendar"></div>

       <div class="selection-info">
    <strong>Seleziona il primo e l'ultimo giorno.</strong>
    <p id="period-info"></p>
</div>

        </div>

    </div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js"></script>

</body>
</html>
